<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu des couleurs</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body class="color-1">
    <div class="content-top">
        <span class="lifes-display" aria-live="polite">Vies: 3</span>
        <span class="score-display" aria-live="polite">Score: 0</span>
        <span class="top-score-display" aria-live="polite">Meilleur score: 0</span>
    </div>

    <div class="content-bottom">
        <button class="btn-play color-2" type="button">Commencer</button>
        <p class="feedback-message" aria-live="polite" aria-atomic="true"></p>
        <button class="btn-restart btn-play" type="button" hidden>Recommencer</button>
    </div>
</body>
</html>
